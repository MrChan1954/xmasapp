<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf8f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1211" />
    <title>No connection · Gift Planner</title>
    <!--
      Shown only when a navigation fails with no network. Deliberately static and
      self-contained: no app JavaScript, no Supabase, and above all no figures.
      Showing a cached balance here would be worse than showing nothing, because
      it could not be trusted.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --ground: #fbf8f3;
        --ink: #1b211e;
        --muted: #5a655f;
        --accent: #0f6b4f;
        --line: #e4daca;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #0c1211;
          --ink: #e8efea;
          --muted: #9baaa3;
          --accent: #3fd6a4;
          --line: #232e2a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
        background: var(--ground);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      main { max-width: 24rem; }
      h1 { margin: 1.25rem 0 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0.75rem 0 0; font-size: 0.95rem; line-height: 1.6; color: var(--muted); }
      button {
        margin-top: 1.75rem;
        padding: 0.7rem 1.4rem;
        font: inherit;
        font-weight: 600;
        color: var(--ground);
        background: var(--accent);
        border: 0;
        border-radius: 9999px;
        cursor: pointer;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main>
      <svg width="72" height="72" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <g transform="translate(0 2.1)">
          <g fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M24 11 15 24h18L24 11Z" />
            <path d="M24 19 11 34h26L24 19Z" />
            <path d="M21 34h6v7h-6z" />
            <path d="M17 41h14" />
          </g>
          <path fill="#c99b2e" d="m24 2 1.5 3.4 3.7.4-2.7 2.5.7 3.7L24 10.2l-3.2 1.8.7-3.7-2.7-2.5 3.7-.4L24 2Z" />
        </g>
      </svg>
      <h1>No connection</h1>
      <p>
        Gift Planner needs the internet so everyone sees the same figures.
        Nothing has been lost — reconnect and carry on where you left off.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
